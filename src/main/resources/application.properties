spring.application.name=reservations-springboot

# URL de connexion spécifique à MariaDB (jdbc:mariadb au lieu de jdbc:mysql)
spring.datasource.url = jdbc:mariadb://localhost:3306/reservations?autoreconnect=true&useSSL=false&serverTimezone=Europe/Brussels&useLegacyDatetimeCode=false

# Identifiants de connexion
spring.datasource.username = root
spring.datasource.password =

# Driver MariaDB
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Configuration Hibernate / JPA
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 1. Désactiver la création automatique de Hibernate pour laisser la main à Flyway
spring.jpa.hibernate.ddl-auto=none
# 2. Activer explicitement Flyway (activé par défaut si le starter est présent)
spring.flyway.enabled=true
# 3. Permettre l'initialisation si votre base de données contient déjà des tables
spring.flyway.baseline-on-migrate=true

spring.mvc.hiddenmethod.filter.enabled=true